name: Android ARM64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Configure Android NDK build
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHOCO_WITH_DOBBY=OFF

      - name: Compile
        run: cmake --build build --config Release --parallel

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: choco-android-arm64
          path: build/libchoco.so
          if-no-files-found: error
